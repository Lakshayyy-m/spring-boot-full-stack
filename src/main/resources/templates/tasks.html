<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8" />
        <title>Secure Task Manager</title>
    </head>
    <body>
        <h1>Secure Task Manager</h1>

        <p>
            Logged in as:
            <span sec:authentication="name">username</span>
        </p>

        <hr />

        <h2>Create / Edit Task</h2>

        <form th:action="@{/tasks}" th:object="${taskForm}" method="post">
            <!-- TODO G: When editing a task, make sure the id is included as a hidden field. -->
            <!-- Hint: Add a hidden input bound to *{id}. -->
            <input type="hidden" th:field="*{id}" />

            <label
                >Title:
                <input type="text" th:field="*{title}" required />
            </label>
            <br /><br />

            <label
                >Description:
                <textarea
                    th:field="*{description}"
                    rows="3"
                    cols="40"
                    required
                ></textarea>
            </label>
            <br /><br />

            <label>
                Completed:
                <input type="checkbox" th:field="*{completed}" />
            </label>
            <br /><br />

            <button type="submit">Save Task</button>
        </form>

        <hr />

        <h2>Existing Tasks</h2>

        <table border="1" cellpadding="6">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Completed</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="t : ${tasks}">
                    <td th:text="${t.id}">1</td>
                    <td th:text="${t.title}">Title</td>
                    <td th:text="${t.description}">Description</td>
                    <td th:text="${t.completed}">false</td>
                    <td>
                        <!-- TODO H: Add an Edit link that calls /tasks/{id}/edit -->
                        <a th:href="@{'/tasks/' + ${t.id} + '/edit'}">Edit</a>
                        <!-- Hint: Use th:href="@{'/tasks/' + ${t.id} + '/edit'}" -->

                        <!-- TODO I: Add a Delete form that posts to /tasks/{id}/delete -->
                        <form
                            th:action="@{'/tasks/' + ${t.id} + '/delete'}"
                            method="post"
                            style="display: inline"
                        >
                            <button type="submit">Delete</button>
                        </form>
                        <!-- Hint: Use a small form with method="post" and a button. -->
                    </td>
                </tr>
            </tbody>
        </table>

        <hr />

        <form th:action="@{/logout}" method="post">
            <button type="submit">Logout</button>
        </form>
    </body>
</html>
